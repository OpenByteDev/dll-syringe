name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "--deny warnings"
  RUSTFLAGS: "--deny warnings"
      
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["nightly"]
        target: ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]
        include:
          - target: x86_64-pc-windows-msvc
            target32: i686-pc-windows-msvc
    steps:
    - uses: actions/checkout@v7
    
    - name: Install latest rust ${{ matrix.toolchain }} for ${{ matrix.target }}
      uses: dtolnay/rust-toolchain@nightly
      with:
          targets: ${{ matrix.target }}
          toolchain: ${{ matrix.toolchain }}
          
    - name: Install latest rust ${{ matrix.toolchain }} for x86 version of target
      if: matrix.target32
      uses: dtolnay/rust-toolchain@nightly
      with:
          targets: ${{ matrix.target32 }}
          toolchain: ${{ matrix.toolchain }}
      
    - name: Build macros
      run: cargo build --target ${{ matrix.target }} --manifest-path "dll-syringe-macros/Cargo.toml" --all-targets
    - name: Build main crate
      run: cargo build --target ${{ matrix.target }}
      
    - name: Build test target
      run: cargo build --target ${{ matrix.target }} --manifest-path "tests/helpers/test_target/Cargo.toml" --all-targets
    - name: Build test payload
      run: cargo build --target ${{ matrix.target }} --manifest-path "tests/helpers/test_payload/Cargo.toml" --all-targets
      
    - name: Test
      run: cargo test --target ${{ matrix.target }} --all-targets --all-features -- --nocapture
  
  test-on-wine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Add windows rust targets
        run: |
          rustup target add x86_64-pc-windows-msvc --toolchain nightly
          rustup target add i686-pc-windows-msvc --toolchain nightly
      - name: Install cargo-xwin
        run: cargo install cargo-xwin
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings && sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt install --install-recommends winehq-stable
      - name: Run tests on Wine
        run: ./scripts/test-wine.ps1
        shell: pwsh

  arm-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install latest rust nightly for aarch64-pc-windows-msvc
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-pc-windows-msvc

      - name: Check macros
        run: cargo check --manifest-path dll-syringe-macros/Cargo.toml --target aarch64-pc-windows-msvc --all-features
        
      - name: Check main crate
        run: cargo check --target aarch64-pc-windows-msvc --all-features

  hack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
      - name: cargo install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: cargo hack main
        run: cargo hack --feature-powerset check
      - name: cargo hack bindings
        run: cargo hack --manifest-path dll-syringe-bindings/Cargo.toml --feature-powerset check
        
  documentation:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install latest nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
    - name: Generate documentation for main
      run: cargo doc --all-features
    - name: Generate documentation for macros
      run: cargo doc --manifest-path dll-syringe-macros/Cargo.toml
    - name: Generate documentation for bindings
      run: cargo doc --manifest-path dll-syringe-bindings/Cargo.toml --all-features
    - name: Install cargo-deadlinks
      run: cargo install cargo-deadlinks
    - name: Check dead links in doc
      run: cargo deadlinks
    - name: Check dead links in macros
      run: cargo deadlinks
      working-directory: dll-syringe-macros
    - name: Check dead links in bindings
      run: cargo deadlinks
      working-directory: dll-syringe-bindings

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
            targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
            components: clippy
      - name: Clippy check
        run: cargo clippy --all-features
      - name: Clippy check macros
        run: cargo clippy --manifest-path dll-syringe-macros/Cargo.toml
      - name: Clippy check bindings
        run: cargo clippy --manifest-path dll-syringe-bindings/Cargo.toml --all-features
      - name: Clippy check test_target
        run: cargo clippy --manifest-path tests/helpers/test_target/Cargo.toml --all-targets
      - name: Clippy check test_payload
        run: cargo clippy --manifest-path tests/helpers/test_payload/Cargo.toml --all-targets --all-features

  fmt:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install latest nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
          components: rustfmt
    - name: Format check
      run: cargo fmt --all -- --check
    - name: Format check macros
      run: cargo fmt --manifest-path dll-syringe-macros/Cargo.toml --all -- --check
    - name: Format check bindings
      run: cargo fmt --manifest-path dll-syringe-bindings/Cargo.toml --all -- --check
    - name: Format check test_target
      run: cargo fmt --manifest-path tests/helpers/test_target/Cargo.toml --all -- --check
    - name: Format check test_payload
      run: cargo fmt --manifest-path tests/helpers/test_payload/Cargo.toml --all -- --check

  bindings:
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest rust nightly for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          architecture: ${{ matrix.arch }}
      - name: Build bindings crate (generates C header + C# NativeMethods.g.cs)
        run: cargo build --manifest-path dll-syringe-bindings/Cargo.toml --target ${{ matrix.target }} --features c,csharp
      - name: Test bindings crate
        run: cargo test --manifest-path dll-syringe-bindings/Cargo.toml --target ${{ matrix.target }} --features c,csharp -- --nocapture

  build-csharp-bindings:
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest rust nightly for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Build bindings crate (release, generates C header)
        run: cargo build --manifest-path dll-syringe-bindings/Cargo.toml --target ${{ matrix.target }} --release --features c,csharp
      - name: Stage native lib for .NET packaging
        shell: pwsh
        working-directory: dll-syringe-bindings
        run: |
          $dest = "bindings/csharp/runtimes/win-${{ matrix.arch }}/native"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dll_syringe_bindings.dll" (Join-Path $dest "dll-syringe.native.dll")
      - name: Upload native lib for .NET packaging
        uses: actions/upload-artifact@v7
        with:
          name: dll-syringe-native-${{ matrix.target }}
          path: dll-syringe-bindings/bindings/csharp/runtimes
      - name: Stage release assets
        shell: pwsh
        working-directory: dll-syringe-bindings
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dll_syringe_bindings.dll" "release-assets/dll-syringe.native.${{ matrix.arch }}.dll"
          Copy-Item "target/${{ matrix.target }}/release/dll_syringe_bindings.lib" "release-assets/dll-syringe.native.${{ matrix.arch }}.lib"
          Copy-Item "bindings/c/dll-syringe.h" "release-assets/dll-syringe.h"
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: dll-syringe-release-${{ matrix.target }}
          path: dll-syringe-bindings/release-assets

  pack-dotnet:
    needs: build-csharp-bindings
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download native lib (x64)
        uses: actions/download-artifact@v8
        with:
          name: dll-syringe-native-x86_64-pc-windows-msvc
          path: dll-syringe-bindings/bindings/csharp/runtimes
      - name: Download native lib (x86)
        uses: actions/download-artifact@v8
        with:
          name: dll-syringe-native-i686-pc-windows-msvc
          path: dll-syringe-bindings/bindings/csharp/runtimes
      - name: Build .NET library
        run: dotnet build bindings/csharp/DllSyringe.csproj -c Release
        working-directory: dll-syringe-bindings
      - name: Pack .NET library
        run: dotnet pack bindings/csharp/DllSyringe.csproj -c Release -o ../nupkgs --no-build
        working-directory: dll-syringe-bindings
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: dll-syringe-nuget
          path: nupkgs

  publish-crate:
    permissions:
      contents: write
      id-token: write
    needs: [test,bindings,build-csharp-bindings,test-on-wine,pack-dotnet,arm-build,hack,documentation]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: dll-syringe-nuget
          path: release-assets
      - name: Download release assets (x64)
        uses: actions/download-artifact@v8
        with:
          name: dll-syringe-release-x86_64-pc-windows-msvc
          path: release-assets
      - name: Download release assets (x86)
        uses: actions/download-artifact@v8
        with:
          name: dll-syringe-release-i686-pc-windows-msvc
          path: release-assets
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: OpenByteDev
      - name: Upload to NuGet
        shell: pwsh
        run: dotnet nuget push "release-assets/*.nupkg" -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" -s "https://api.nuget.org/v3/index.json" --skip-duplicate
      - name: GitHub Release Artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
      - name: crates.io login (OIDC)
        id: crates-io-login
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-login.outputs.token }}
        run: |
          $output = cargo publish --manifest-path dll-syringe-macros/Cargo.toml 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -and $output -notmatch "already (uploaded|exists)") {
            exit $LASTEXITCODE
          }
          cargo publish

