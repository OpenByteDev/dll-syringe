[package]
name = "dll-syringe-bindings"
version = "0.18.1"
description = "C and C# bindings for dll-syringe."
license = "MIT"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
dll-syringe = { path = "..", default-features = false, features = ["syringe", "into-x86-from-x64"] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false, optional = true }
csbindgen = { version = "1.9", default-features = false, optional = true }

[dev-dependencies]
find-msvc-tools = { version = "0.1", default-features = false }
widestring = { version = "1.2", features = ["std", "alloc"], default-features = false }
windows-sys = { version = ">=0.59, <=0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"], default-features = false }
current_platform = { version = "0.2", default-features = false }
tempfile = { version = "3.23", default-features = false }
path-absolutize = { version = "1.0", default-features = false }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[features]
default = []
c = ["cbindgen"]
csharp = ["csbindgen"]
